schema_version: 1

context:
  name: vertex-cli
  version: "1.0.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vertex-cli/vertex_cli-${{ version }}.tar.gz
  sha256: ed02c84ef59ec44e7593b5cacf50cc447364f84de67e76cf2d5a4845d8c37688

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - tex = cli.prompt:main
      - tex-init = cli.utils:install_requirements

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }}
    - rich >=14.0.0,<16.0.0
    - langchain-core >=1.0.0,<2.0.0
    - langchain-google-genai >=3.0.0,<5.0.0

tests:
  - python:
      imports:
        - cli
        - cli.models
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - tex
      - tex list

about:
  homepage: https://github.com/prathamhole14/Vertex-CLI
  summary: A unified CLI tool for interacting with multiple LLMs via LangChain
  description: |
    Vertex CLI is a command line tool for talking to several large language
    model providers through a single interface built on LangChain. Google
    Gemini support is installed by default, and the OpenAI and Anthropic
    providers can be enabled by installing langchain-openai or
    langchain-anthropic alongside this package.

    It keeps conversation history between invocations, lets you register and
    switch between configured models, and can read recent shell history to
    explain commands that failed.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/prathamhole14/Vertex-CLI
  documentation: https://prathamhole14.github.io/Vertex-CLI/

extra:
  recipe-maintainers:
    - prathamhole14
