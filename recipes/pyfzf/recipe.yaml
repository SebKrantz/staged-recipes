schema_version: 1

context:
  version: "0.3.1"

package:
  name: pyfzf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfzf/pyfzf-${{ version }}.tar.gz
  sha256: dd902e34cffeca9c3082f96131593dd20b4b3a9bba5b9dde1b0688e424b46bd2

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # Not in the upstream metadata, but FzfPrompt() raises SystemError when the
    # fzf binary is not on PATH, so the wrapper cannot do anything without it.
    - fzf

tests:
  - python:
      imports:
        - pyfzf
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      # Constructing FzfPrompt is what probes PATH for fzf, so this also checks
      # that the fzf run dependency is actually resolvable.
      - python -c "from pyfzf import FzfPrompt; FzfPrompt()"

about:
  homepage: https://github.com/nk412/pyfzf
  summary: Python wrapper for junegunn's fuzzy finder (fzf)
  description: |
    pyfzf lets Python code drive fzf, the command-line fuzzy finder. It pipes
    an iterable of choices to an fzf subprocess and returns the entries the
    user selected, so a script can offer interactive filtering without
    implementing its own picker.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/nk412/pyfzf

extra:
  recipe-maintainers:
    - chrisburr
