schema_version: 1

context:
  python_min: "3.12"
  version: "0.1.0"

package:
  name: spharmgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spharmgrid/spharmgrid-${{ version }}.tar.gz
  sha256: a16225d495b26d1774b5bedc6688b6a448cb73e69bbad22cb7d7ddef23b21c31

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - spharmgrid = spharmgrid.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - ducc0 >=0.39.0
    - numpy >=2.0.0
    - xarray >=2025.11.0

tests:
  - python:
      imports:
        - spharmgrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest >=9.1.1
        - cftime >=1.6.5
        - dask-core >=2024.1.0
    files:
      source:
        - tests/
        - pyproject.toml
    script:
      - spharmgrid --help
      - pytest -m "not parity"

about:
  summary: Spherical harmonic tools for filtering, regridding, and kinematics in atmospheric science with xarray
  description: |
    spharmgrid (spherical harmonic gridding) implements spherical harmonic
    filtering, regridding, differential operators, and atmospheric wind
    diagnostics for global xarray fields. It computes relative vorticity,
    divergence, streamfunction, velocity potential, Helmholtz decomposition,
    and inverse wind transforms.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/spharmgrid/
  documentation: https://spharmgrid.readthedocs.io/
  repository: https://github.com/mwyau/spharmgrid

extra:
  recipe-maintainers:
    - mwyau
